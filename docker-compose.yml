version: '3.8'

services:
  app:
    build: .
    container_name: sqlalchemy-sqlite-app
    volumes:
      # Mount the data directory to persist SQLite database files
      - ./data:/app/data
    ports:
      - "3001:5000"   # or
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "python -m src.database.init_db && tail -f /dev/null"